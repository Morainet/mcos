<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="730" height="220" viewBox="0 0 730 220" role="img" aria-label="MCOS logo">
  <title>MCOS logo</title>
  <!-- MCOS logo: modern GitHub-project style.
       Left: rounded gradient app-icon holding a white terminal prompt
       ("> _") — the command / OS motif. Right: bold geometric wordmark.
       A single left-to-right gradient (teal -> cyan -> indigo) unifies
       icon and wordmark for a cohesive brand flow. -->
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="706" y2="0">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="0.5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- app icon -->
  <rect x="24" y="30" width="160" height="160" rx="40" fill="url(#brand)"/>
  <!-- terminal prompt: chevron + underscore -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 74 82 L 118 110 L 74 138"/>
    <path d="M 116 150 L 158 150"/>
  </g>

  <!-- wordmark -->
  <text x="214" y="150" fill="url(#brand)"
        font-family="'Poppins','Montserrat','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="120" font-weight="800" letter-spacing="4">MCOS</text>
</svg>
