name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast safety net: golden fixture gate ────────────────────────────────
  # Runs the DSL ↔ IR golden round-trip tests on their own so a regression
  # fails fast (~2 min) without waiting for the full JVM test suite.
  # timeout-minutes + coreutils timeout: if a test hangs the job fails fast
  # instead of silently running until GitHub's 6h default limit.
  golden-gate:
    name: Golden fixture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Golden fixture gate (DSL ↔ IR round-trip)
        run: >-
          timeout -k 60s 8m ./gradlew :mcos-runtime-core:test
          --tests "com.morainet.mcos.runtime.core.parse.DslParserTest"
          --console=plain --no-daemon

  # ── JVM tests, sharded to run in parallel ───────────────────────────────
  # Pure Kotlin/JVM modules (sdk + the runtime split: security, runtime-core,
  # llm, marketplace, facade + 4 plugins). Each shard is an independent job so
  # the wall-clock time stays at the slowest shard. The old five-package
  # --tests combo on one module hung for hours (SharedFlow observer never
  # cancelled); per-module tasks eliminate that class of failure entirely —
  # package-level parallelism is now Gradle's problem inside one module.
  # timeout-minutes + `timeout -k 60s 25m` turn any hang into a hard failure.
  jvm-tests:
    name: JVM tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sdk
            tasks: ":mcos-sdk:test"

          - shard: runtime-security
            tasks: ":mcos-security:test"

          - shard: runtime-core
            tasks: ":mcos-runtime-core:test"

          - shard: runtime-llm
            tasks: ":mcos-llm:test"

          - shard: runtime-marketplace
            tasks: ":mcos-marketplace:test"

          - shard: runtime-facade
            tasks: ":mcos-runtime:test"

          - shard: server
            tasks: ":mcos-server:test"

          - shard: plugins
            tasks: >-
              :plugins:mcos-plugin-hello:test
              :plugins:mcos-plugin-system:test
              :plugins:mcos-plugin-camera:test
              :plugins:mcos-plugin-files:test
              :plugins:mcos-plugin-iot:test
              --parallel
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests (${{ matrix.shard }})
        run: timeout -k 60s 25m ./gradlew ${{ matrix.tasks }} --console=plain --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ matrix.shard }}
          path: "**/build/reports/tests/test/**"
          if-no-files-found: ignore
          retention-days: 7

  # ── Android app compiles ─────────────────────────────────────────────────
  # Validates the Android host SDK library (mcos-android-sdk) and the Compose
  # demo shell (mcos-android) built on top of it. Needs the Android SDK, so it
  # is a separate, slower job.
  android-build:
    name: Android build (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + assemble debug APK
        run: timeout -k 60s 25m ./gradlew :mcos-android-sdk:testDebugUnitTest :mcos-android:testDebugUnitTest :mcos-android:assembleDebug --console=plain --no-daemon

      # Exercises the publication task graph (maven-publish convention, BOM,
      # AAR release variant) on every PR so config drift fails here, not at
      # tag time. Unsigned — signing only activates with -PsigningKey, and no
      # secrets exist on CI. Artifacts land in build/central-bundle and are
      # discarded; the throwaway version never reaches any repository.
      - name: Publish dry-run (unsigned)
        run: timeout -k 60s 10m ./gradlew publish -PmcosVersion=0.0.0-ci --console=plain --no-daemon

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcos-debug-apk
          path: "mcos-android/build/outputs/apk/debug/*.apk"
          if-no-files-found: ignore
          retention-days: 7
