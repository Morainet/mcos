name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast safety net: golden fixture gate ────────────────────────────────
  # Runs the DSL ↔ IR golden round-trip tests on their own so a regression
  # fails fast (~2 min) without waiting for the full JVM test suite.
  # timeout-minutes + coreutils timeout: if a test hangs the job fails fast
  # instead of silently running until GitHub's 6h default limit.
  golden-gate:
    name: Golden fixture gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Golden fixture gate (DSL ↔ IR round-trip)
        run: >-
          timeout -k 60s 8m ./gradlew :mcos-runtime:test --tests
          "com.mcos.runtime.parse.DslParserTest"
          --console=plain --no-daemon

  # ── JVM tests, sharded to run in parallel ───────────────────────────────
  # Pure Kotlin/JVM modules (sdk, runtime, 4 plugins). Each shard is an
  # independent job so the wall-clock time drops from ~40 min (serial) to the
  # slowest shard (~8-12 min). fail-fast=false keeps every shard's report.
  # runtime-platform was split into llm + core: the five-package combo hung
  # for hours (SharedFlow observer never cancelled in McosRuntimeConfirmationTest),
  # and a hang in one shard must not mask the other packages' results.
  # timeout-minutes + `timeout -k 60s 25m` turn any hang into a hard failure.
  jvm-tests:
    name: JVM tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sdk
            tasks: ":mcos-sdk:test"

          - shard: runtime-parse-marketplace-plugin
            tasks: >-
              :mcos-runtime:test
              --tests "com.mcos.runtime.parse.*"
              --tests "com.mcos.runtime.marketplace.*"
              --tests "com.mcos.runtime.plugin.*"

          - shard: runtime-security
            tasks: >-
              :mcos-runtime:test
              --tests "com.mcos.runtime.security.*"
              --tests "com.mcos.runtime.audit.*"
              --tests "com.mcos.runtime.validate.*"

          - shard: runtime-core
            tasks: >-
              :mcos-runtime:test
              --tests "com.mcos.runtime.executor.*"
              --tests "com.mcos.runtime.registry.*"

          - shard: runtime-platform-llm
            tasks: ":mcos-runtime:test --tests \"com.mcos.runtime.llm.*\""

          - shard: runtime-platform-core
            tasks: >-
              :mcos-runtime:test
              --tests "com.mcos.runtime.memory.*"
              --tests "com.mcos.runtime.permission.*"
              --tests "com.mcos.runtime.events.*"
              --tests "com.mcos.runtime.api.*"

          - shard: runtime-workflow
            tasks: ":mcos-runtime:test --tests \"com.mcos.runtime.workflow.*\""

          - shard: plugins
            tasks: >-
              :plugins:mcos-plugin-hello:test
              :plugins:mcos-plugin-system:test
              :plugins:mcos-plugin-camera:test
              :plugins:mcos-plugin-files:test
              --parallel
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests (${{ matrix.shard }})
        run: timeout -k 60s 25m ./gradlew ${{ matrix.tasks }} --console=plain --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ matrix.shard }}
          path: "**/build/reports/tests/test/**"
          if-no-files-found: ignore
          retention-days: 7

  # ── Android app compiles ─────────────────────────────────────────────────
  # Validates the Compose shell (mcos-android) still builds against the runtime.
  # Needs the Android SDK, so it is a separate, slower job.
  android-build:
    name: Android build (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: timeout -k 60s 25m ./gradlew :mcos-android:assembleDebug --console=plain --no-daemon

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcos-debug-apk
          path: "mcos-android/build/outputs/apk/debug/*.apk"
          if-no-files-found: ignore
          retention-days: 7
